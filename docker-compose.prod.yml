services:
  app:
    volumes:
      # Only mount the database file so data persists if the container restarts
      - sqlite_data:/var/www/html/database
    
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
    
    # Ensure it always restarts on server reboot
    restart: always
    
    # Resource constraints to prevent memory leaks from crashing the VPS
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  sqlite_data:
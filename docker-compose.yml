services:
  app:
    build: 
      context: .
      target: app
    container_name: laravel_dev
    ports:
      - "8000:8000"
    volumes:
      # Sync local code to container
      - .:/var/www/html
      # Protect the container's vendor folder from being overwritten by local
      - /var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
    restart: unless-stopped